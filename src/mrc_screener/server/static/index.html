<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>mrc-screener</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="banner" class="banner hidden"></div>

  <div id="status-bar">
    <span id="position">-- / --</span>
    <span id="filename"></span>
    <span id="counts">keep 0 &middot; reject 0</span>
  </div>

  <div id="viewer">
    <img id="frame" alt="tomogram preview" />
    <div id="slice-label"></div>
  </div>

  <div id="done" class="hidden">
    <h2>Queue complete</h2>
    <p id="done-summary"></p>
    <button id="export-btn">Export _screened.txt / _kept.txt</button>
    <p id="export-result"></p>
  </div>

  <div id="help" class="hidden">
    <table>
      <tr><td>enter</td><td>keep, advance</td></tr>
      <tr><td>backspace</td><td>reject, advance</td></tr>
      <tr><td>&rarr; / &larr;</td><td>next / previous tomogram</td></tr>
      <tr><td>&uarr; / &darr;</td><td>scrub Z slices</td></tr>
      <tr><td>u</td><td>undo last decision</td></tr>
      <tr><td>space</td><td>skip without deciding</td></tr>
      <tr><td>?</td><td>show/hide this help</td></tr>
    </table>
  </div>

  <div id="hint-bar">enter keep &middot; backspace reject &middot; &rarr;/&larr; next/prev &middot; &uarr;/&darr; scrub &middot; u undo &middot; space skip &middot; ? help</div>

  <script src="/static/app.js" defer></script>
</body>
</html>
